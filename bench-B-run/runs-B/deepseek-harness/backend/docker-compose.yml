services:
  postgres:
    image: postgres:17-alpine
    container_name: teamleave-postgres
    environment:
      POSTGRES_DB: teamleave
      POSTGRES_USER: teamleave
      POSTGRES_PASSWORD: teamleave
    ports:
      - "5432:5432"
    volumes:
      - teamleave-pgdata:/var/lib/postgresql/data
      - ./database/teamleave.sql:/docker-entrypoint-initdb.d/01-teamleave.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamleave -d teamleave"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teamleave-pgdata:
